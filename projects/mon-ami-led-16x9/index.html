<!doctype html>
<html lang="es-HN" data-composition-width="1920" data-composition-height="1080">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Mon Ami — LED 16:9 (razones para venir)</title>
    <!-- GSAP vendorizado (3.14.2): el render no hace ninguna petición de red. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Fuentes de marca servidas desde el proyecto (subset latin, variables):
         render offline y determinista, sin fetch en tiempo de render. */
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: normal;
        font-weight: 300 700;
        font-display: block;
        src: url("assets/fonts/cormorant-garamond-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Jost";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("assets/fonts/jost-latin.woff2") format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }

      /* ---- Tokens de marca Mon Ami (assets/tokens.json) ---- */
      :root {
        --ma-negro: #000000;
        --ma-dorado: #e9d9a0;
        --ma-dorado-luz: #f4e9c2;
        --ma-dorado-bronce: #b8862e;
        --ma-crema: #f4efe4;
        --ma-taupe: #a49d8f;
        --ma-borgona: #6e1423;
        --safe: 96px;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ma-negro);
      }

      /* ============================================================
         CAPA COMPARTIDA (no es clip — vive toda la composición).
         Tres tomas nada más: el ritmo lo lleva el movimiento de cámara
         dentro de cada toma, no el corte. La selección favorece el
         registro de sobremesa —plato elaborado, copa al lado, mesa
         puesta— por encima del apetito inmediato.
         ============================================================ */
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Las fotos son 4:5 nativas (1620x2025). Estiradas a 16:9 con cover
         solo se ve el 45% de su altura: el emplatado que el restaurante
         aprobo se convierte en un macro sin contexto. Asi que los platos
         viven en un panel de 1020 px que invade hacia el centro del frame:
         la foto entra completa a lo ancho y la comida deja de morir contra
         el borde derecho. El campo negro de la izquierda es del copy. */
      .shot {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 900px;
        right: 0;
        opacity: 0;
        overflow: hidden;
        will-change: opacity;
      }
      /* La mesa puesta es ambiente, no emplatado: recortarla no destruye
         nada, y a pantalla completa el cierre gana peso. */
      #sh-mesa {
        left: 0;
      }
      /* Ventana de revelado: se abre en banda horizontal (scaleY). */
      .banda {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transform-origin: 50% 50%;
      }
      /* Contra-escala: cancela el aplastado de la banda para que la foto
         nunca se deforme mientras la ventana se abre. */
      .contra {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      .shot img {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1020px;
        height: 1080px;
        object-fit: cover;
        transform: translate(-50%, -50%);
        transform-origin: 50% 46%;
        will-change: transform;
      }
      /* La comida de las dos primeras tomas vive en la mitad alta de la
         foto: el crop se ancla arriba para que el plato quede en cuadro
         y no una mesa vacia. */
      #sh-surfturf img,
      #sh-ribs img {
        object-position: 50% 0%;
      }
      #sh-mesa img {
        width: 1920px;
        transform-origin: 50% 40%;
      }

      /* Borde izquierdo del panel: sin esto el corte contra el negro es una
         linea recta y el montaje lee como plantilla, no como composicion. */
      #panel-fade {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 820px;
        width: 260px;
        background: linear-gradient(
          to right,
          rgba(0, 0, 0, 1) 0%,
          rgba(0, 0, 0, 0.86) 34%,
          rgba(0, 0, 0, 0.4) 68%,
          rgba(0, 0, 0, 0) 100%
        );
      }

      /* Barrido de luz cálida: cruza el frame en el arranque de cada toma. */
      #barrido {
        position: absolute;
        top: -24%;
        left: 900px;
        width: 320px;
        height: 148%;
        /* Horizontal puro: sobre una caja mas alta que ancha, un angulo
           cercano a la vertical deja los bordes laterales sin difuminar. */
        background: linear-gradient(
          to right,
          rgba(233, 217, 160, 0) 0%,
          rgba(244, 233, 194, 0.08) 28%,
          rgba(233, 217, 160, 0.2) 50%,
          rgba(244, 233, 194, 0.08) 72%,
          rgba(233, 217, 160, 0) 100%
        );
        mix-blend-mode: screen;
        opacity: 0;
      }

      /* Bloom ámbar: simula el spot cálido del local. */
      #bloom {
        position: absolute;
        left: 76%;
        top: 42%;
        width: 1500px;
        height: 1500px;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle,
          rgba(233, 217, 160, 0.22) 0%,
          rgba(184, 134, 46, 0.1) 34%,
          rgba(0, 0, 0, 0) 66%
        );
        mix-blend-mode: screen;
        opacity: 0.5;
      }

      /* Viñeta de ambiente (visual-specs §3). */
      #vineta {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 62% 44%,
          rgba(0, 0, 0, 0) 24%,
          rgba(0, 0, 0, 0.56) 100%
        );
      }

      /* Scrim inferior — obligatorio bajo todo texto sobre foto (§4.2). */
      #scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.78) 18%,
          rgba(0, 0, 0, 0.48) 32%,
          rgba(0, 0, 0, 0.16) 46%,
          rgba(0, 0, 0, 0) 62%
        );
      }
      /* Scrim superior: cubre el bloque de marca, que ahora llega a y~230.
         Se densifica justo en la banda que la medicion dio por vacia, asi
         que gana legibilidad sin robarle luz a ningun plato. */
      #scrim-top {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.8) 11%,
          rgba(0, 0, 0, 0.58) 19%,
          rgba(0, 0, 0, 0.26) 24%,
          rgba(0, 0, 0, 0) 31%
        );
      }

      #grano {
        position: absolute;
        inset: -64px;
        background-image: url("assets/img/grain.png");
        background-size: 256px 256px;
        opacity: 0.13;
        mix-blend-mode: overlay;
      }

      /* ---- Marca permanente: logo + enlace, superior izquierda ---- */
      /* El clip se posiciona a mano para poder apilarse sobre el cierre:
         el logo y el enlace viven los 8 s completos. */
      #herrajes {
        position: absolute;
        inset: 0;
        z-index: 40;
      }
      /* Medicion sobre 9 muestras de los 8 s (celdas de 180x150 px): la
         columna x0-180 es el eje mas limpio del frame en toda su altura
         (riesgo 0.19 / 0.42 / 0.21 / 0.22) y la banda y0-150 es la franja
         mas limpia de lado a lado. La comida vive en x360-900, y300-600
         (riesgo 0.55-0.71). Por eso la marca crece hacia la derecha y hacia
         abajo desde la esquina superior izquierda: es el unico cuadrante que
         ninguna de las tres tomas ocupa. */
      #marca {
        position: absolute;
        top: 64px;
        left: var(--safe);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      #marca .logo {
        display: block;
        width: 460px;
        height: auto;
      }
      #marca .filete {
        height: 2px;
        width: 184px;
        background: linear-gradient(90deg, var(--ma-dorado) 0%, rgba(184, 134, 46, 0) 100%);
        transform-origin: left center;
      }
      #marca .enlace {
        font-family: "Jost", sans-serif;
        font-weight: 500;
        font-size: 42px;
        letter-spacing: 0.13em;
        color: var(--ma-crema);
        white-space: nowrap;
      }

      .marca-registro {
        position: absolute;
        width: 34px;
        height: 34px;
        border-color: var(--ma-dorado-bronce);
        border-style: solid;
        opacity: 0.65;
      }
      .mr-bl {
        bottom: 48px;
        left: 48px;
        border-width: 0 0 2px 2px;
      }
      .mr-br {
        bottom: 48px;
        right: 48px;
        border-width: 0 2px 2px 0;
      }

      /* ============================================================
         CAPAS DE TEXTO — clips transparentes, uno por beat.
         ============================================================ */
      .beat {
        position: absolute;
        left: var(--safe);
        right: auto;
        max-width: 984px;
        bottom: 128px;
        z-index: 20;
      }
      /* La opacidad se anima en este hijo, nunca en el .clip:
         el framework ya controla la visibilidad del clip. */
      .beat-inner {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 22px;
      }

      .eyebrow {
        font-family: "Jost", sans-serif;
        font-weight: 400;
        font-size: 36px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--ma-taupe);
      }

      .filete-beat {
        height: 2px;
        width: 132px;
        background: linear-gradient(
          100deg,
          var(--ma-dorado-bronce) 0%,
          var(--ma-dorado-luz) 48%,
          var(--ma-dorado-bronce) 100%
        );
        transform-origin: left center;
      }

      /* Reveal por máscara: cada línea vive en su propia ventana. */
      .linea {
        display: block;
        overflow: hidden;
        transform-origin: left center;
        padding-bottom: 0.12em;
      }
      .linea > span {
        display: block;
        font-family: "Cormorant Garamond", serif;
        line-height: 1.06;
      }

      .titular > span {
        font-weight: 300;
        font-size: 104px;
        color: var(--ma-crema);
      }

      /* ---- Beat 3: cierre — la invitación a venir al local ---- */
      #cierre {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Aire para el logo, que en el cierre viaja de la esquina al centro
           y aterriza encima de la invitacion. */
        padding: 130px var(--safe) 0;
        z-index: 30;
      }
      /* Más claro que un cierre a negro: se quiere que la mesa puesta
         siga leyéndose detrás — es a eso a lo que se invita. */
      #cierre-fondo {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 50% 72%,
            rgba(110, 20, 35, 0.34) 0%,
            rgba(110, 20, 35, 0.14) 52%,
            rgba(110, 20, 35, 0) 96%
          ),
          rgba(0, 0, 0, 0.8);
      }
      #cierre .invitacion {
        position: relative;
        margin-top: 0;
        font-family: "Cormorant Garamond", serif;
        font-weight: 400;
        font-size: 92px;
        line-height: 1.08;
        color: var(--ma-dorado);
        text-align: center;
      }
      #cierre .filete-cierre {
        position: relative;
        margin-top: 40px;
        height: 2px;
        width: 200px;
        background: linear-gradient(
          100deg,
          rgba(184, 134, 46, 0) 0%,
          var(--ma-dorado-luz) 50%,
          rgba(184, 134, 46, 0) 100%
        );
        transform-origin: center;
      }
      /* La dirección manda: el objetivo del spot es que la gente camine
         hasta el local, así que pesa más que el teléfono. */
      #cierre .lugar {
        position: relative;
        margin-top: 38px;
        font-family: "Jost", sans-serif;
        font-weight: 400;
        font-size: 46px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ma-crema);
        text-align: center;
      }
      #cierre .ciudad {
        position: relative;
        margin-top: 16px;
        font-family: "Jost", sans-serif;
        font-weight: 300;
        font-size: 30px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--ma-taupe);
      }
      /* El remate del CTA: en el cierre el enlace de la esquina se apaga,
         asi que este es el unico lugar donde el dominio se queda — pesa. */
      #cierre .web {
        position: relative;
        margin-top: 36px;
        font-family: "Jost", sans-serif;
        font-weight: 600;
        font-size: 58px;
        letter-spacing: 0.1em;
        color: var(--ma-dorado-luz);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <!-- ===== Capa compartida: tres tomas + atmósfera ===== -->
      <div id="stage" data-layout-allow-overflow>
        <div class="shot" id="sh-surfturf">
          <div class="banda">
            <div class="contra"><img src="assets/img/surfturf.jpg" alt="" /></div>
          </div>
        </div>
        <div class="shot" id="sh-ribs">
          <div class="banda">
            <div class="contra"><img src="assets/img/ribs.jpg" alt="" /></div>
          </div>
        </div>
        <div class="shot" id="sh-mesa">
          <div class="banda">
            <div class="contra"><img src="assets/img/mesa.jpg" alt="" /></div>
          </div>
        </div>

        <div id="panel-fade"></div>
        <div id="barrido"></div>
        <div id="bloom"></div>
        <div id="vineta"></div>
        <div id="scrim"></div>
        <div id="scrim-top"></div>
        <div id="grano"></div>
      </div>

      <!-- ===== Marca permanente (0.00 – 8.00) ===== -->
      <section id="herrajes" class="clip" data-start="0" data-duration="8" data-track-index="7">
        <div id="marca" data-layout-allow-overlap>
          <img class="logo" src="assets/logo-mon-ami-gold.png" alt="Mon Ami Bistro Bar" />
          <div class="filete"></div>
          <div class="enlace">monamihn.com</div>
        </div>

        <div class="marca-registro mr-bl"></div>
        <div class="marca-registro mr-br"></div>
      </section>

      <!-- ===== Beat 1 · la razón (0.00 – 2.85) =====
           No nombra la ocasión: deja que la ponga quien mira. -->
      <section id="b1" class="clip beat" data-start="0" data-duration="2.85" data-track-index="1">
        <div class="beat-inner">
          <div class="eyebrow">San Pedro Sula</div>
          <div class="filete-beat"></div>
          <div class="linea titular" data-layout-allow-overflow data-layout-allow-overlap>
            <span>No toda cena</span>
          </div>
          <div class="linea titular" data-layout-allow-overflow data-layout-allow-overlap>
            <span>es solo una cena.</span>
          </div>
        </div>
      </section>

      <!-- ===== Beat 2 · la invitación a quedarse (2.95 – 5.70) ===== -->
      <section id="b2" class="clip beat" data-start="2.95" data-duration="2.75" data-track-index="2">
        <div class="beat-inner">
          <div class="eyebrow">Sin prisa</div>
          <div class="filete-beat"></div>
          <div class="linea titular" data-layout-allow-overflow data-layout-allow-overlap>
            <span>Vení por la comida.</span>
          </div>
          <div class="linea titular" data-layout-allow-overflow data-layout-allow-overlap>
            <span>Quedate por la noche.</span>
          </div>
        </div>
      </section>

      <!-- ===== Beat 3 · cierre: vení al restaurante (5.75 – 8.00) ===== -->
      <section id="cierre" class="clip" data-start="5.75" data-duration="2.25" data-track-index="3">
        <div id="cierre-fondo"></div>
        <div class="invitacion">Vení. Tu mesa está lista.</div>
        <div class="filete-cierre"></div>
        <div class="lugar">Plaza Paseo Próceres</div>
        <div class="ciudad">San Pedro Sula</div>
        <div class="web">monamihn.com</div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ------------------------------------------------------------------
         CAPA FOTOGRÁFICA — tres tomas, dos cortes, ahora en 8 s.
         El recorte respecto de los 10 s no reparte el tijeretazo por igual:
         los dos beats de texto pierden ~0.5 s cada uno y el cierre pierde
         casi 1 s, porque el logo y el enlace ya no dependen de él: viven
         arriba a la izquierda todo el spot.

           beat  toma      in     out    cámara
           1     surfturf  0.00   2.65   empuje largo + subida
           2     ribs      2.65   5.50   retroceso + barrido lateral
           3     mesa      5.50   8.00   empuje lento (fondo del cierre)

         Las tomas 2 y 3 entran por REVELADO EN BANDA: la ventana .banda
         se abre en scaleY mientras .contra la compensa, de modo que la
         foto nunca se deforma.
         ------------------------------------------------------------------ */
      tl.set("#sh-surfturf", { opacity: 1 }, 0);
      /* Margen de paneo dentro del panel: a scale S sobran 450(S-1) px en x
         y (1125S-1080)/2 en y. Por eso los recorridos son de decenas de px y
         no de cientos como en vertical: pasarse deja ver el borde del panel. */
      tl.fromTo(
        "#sh-surfturf img",
        { scale: 1.05, x: 0, y: 0 },
        { scale: 1.17, x: 0, y: -26, duration: 2.9, ease: "none" },
        0,
      );

      tl.set("#sh-ribs", { opacity: 1 }, 2.65);
      tl.fromTo(
        "#sh-ribs .banda",
        { scaleY: 0.44 },
        { scaleY: 1, duration: 0.48, ease: "power3.out" },
        2.65,
      );
      tl.fromTo(
        "#sh-ribs .contra",
        { scaleY: 2.273 },
        { scaleY: 1, duration: 0.48, ease: "power3.out" },
        2.65,
      );
      // La toma saliente disuelve mientras la banda abre: sin esto se ven
      // las dos fotos a la vez y el corte lee como error, no como diseño.
      tl.to("#sh-surfturf", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 2.65);
      /* Ribs: la foto ancla arriba (object-position 0%) y aun asi el plato
         queda alto, porque en la foto no hay nada encima de el. El zoom
         fuerte + y positivo lo bajan al centro del panel sin revelar el
         borde superior de la foto (limite: y <= 497(S-1) con origin 46%). */
      tl.fromTo(
        "#sh-ribs img",
        { scale: 1.34, x: -22, y: 128 },
        { scale: 1.26, x: 18, y: 126, duration: 3.0, ease: "none" },
        2.65,
      );

      tl.set("#sh-mesa", { opacity: 1 }, 5.5);
      tl.fromTo(
        "#sh-mesa .banda",
        { scaleY: 0.44 },
        { scaleY: 1, duration: 0.48, ease: "power3.out" },
        5.5,
      );
      tl.fromTo(
        "#sh-mesa .contra",
        { scaleY: 2.273 },
        { scaleY: 1, duration: 0.48, ease: "power3.out" },
        5.5,
      );
      tl.to("#sh-ribs", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 5.5);
      // El borde del panel deja de tener sentido en cuanto la toma es full-bleed.
      tl.to("#panel-fade", { opacity: 0, duration: 0.44, ease: "power2.inOut" }, 5.5);
      tl.fromTo(
        "#sh-mesa img",
        { scale: 1.02, x: 0, y: 16 },
        { scale: 1.16, x: 0, y: -14, duration: 2.5, ease: "none" },
        5.5,
      );

      /* ---- Barrido de luz: cruza el frame al abrir cada toma ----
         Recorrido y envolvente de opacidad van en tweens separados, y las
         dos rampas de opacidad no se solapan: dos tweens escribiendo la
         misma propiedad a la vez dependen del orden de overwrite de GSAP
         y pueden variar entre renders. */
      tl.fromTo(
        "#barrido",
        { x: -420, skewX: -9 },
        { x: 1060, skewX: -9, duration: 1.0, ease: "power2.inOut" },
        0.1,
      );
      tl.fromTo(
        "#barrido",
        { opacity: 0 },
        { opacity: 0.78, duration: 0.3, ease: "power2.out" },
        0.1,
      );
      tl.to("#barrido", { opacity: 0, duration: 0.28, ease: "power2.in" }, 0.75);

      tl.fromTo(
        "#barrido",
        { x: -420, skewX: -9 },
        { x: 1060, skewX: -9, duration: 1.0, ease: "power2.inOut" },
        2.75,
      );
      tl.fromTo(
        "#barrido",
        { opacity: 0 },
        { opacity: 0.78, duration: 0.3, ease: "power2.out" },
        2.75,
      );
      tl.to("#barrido", { opacity: 0, duration: 0.28, ease: "power2.in" }, 3.4);

      tl.fromTo(
        "#barrido",
        { x: -420, skewX: -9 },
        { x: 1060, skewX: -9, duration: 1.0, ease: "power2.inOut" },
        5.6,
      );
      tl.fromTo(
        "#barrido",
        { opacity: 0 },
        { opacity: 0.6, duration: 0.3, ease: "power2.out" },
        5.6,
      );
      tl.to("#barrido", { opacity: 0, duration: 0.28, ease: "power2.in" }, 6.25);

      /* ---- Atmósfera ---- */
      tl.fromTo(
        "#bloom",
        { opacity: 0.76, scale: 1.06 },
        { opacity: 0.44, scale: 1, duration: 1.1, ease: "power2.out" },
        0,
      );
      tl.fromTo(
        "#bloom",
        { opacity: 0.76, scale: 1.06 },
        { opacity: 0.44, scale: 1, duration: 1.1, ease: "power2.out" },
        2.65,
      );
      tl.fromTo(
        "#bloom",
        { opacity: 0.76, scale: 1.06 },
        { opacity: 0.44, scale: 1, duration: 1.1, ease: "power2.out" },
        5.5,
      );
      tl.fromTo(
        "#vineta",
        { opacity: 0.82 },
        { opacity: 1, duration: 4, ease: "sine.inOut", yoyo: true, repeat: 1 },
        0,
      );
      // Deriva del grano: 4 tramos discretos, sin aleatoriedad en tiempo de render.
      tl.to("#grano", { x: 26, y: -18, duration: 2, ease: "none" }, 0);
      tl.to("#grano", { x: -14, y: 22, duration: 2, ease: "none" }, 2);
      tl.to("#grano", { x: 20, y: 12, duration: 2, ease: "none" }, 4);
      tl.to("#grano", { x: -22, y: -10, duration: 2, ease: "none" }, 6);

      /* ---- Marca permanente: entra una vez y ya no se va ----
         El logo y el enlace son el único elemento que sobrevive los tres
         beats, así que no llevan salida: son el ancla del spot en pantalla
         LED, donde el espectador entra a mitad del loop. */
      tl.fromTo(
        "#marca .logo",
        { opacity: 0, y: -14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        0.15,
      );
      tl.fromTo(
        "#marca .filete",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power3.out" },
        0.4,
      );
      tl.fromTo(
        "#marca .enlace",
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power2.out" },
        0.5,
      );
      tl.fromTo(
        ".marca-registro",
        { opacity: 0, scale: 0.6 },
        { opacity: 0.65, scale: 1, duration: 0.5, stagger: 0.06, ease: "back.out(2)" },
        0.2,
      );

      /* ------------------------------------------------------------------
         TIPOGRAFÍA — entrada de ~0.75 s y luego reposo quieto de ~1.2 s.
         Ese reposo es el tiempo de lectura y es lo que se protegió al
         bajar de 10 s a 8 s.
         ------------------------------------------------------------------ */

      /* Beat 1 · la razón: asentada a los 1.31 s, quieta hasta 2.52 s */
      tl.fromTo(
        "#b1 .eyebrow",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.3,
      );
      tl.fromTo(
        "#b1 .filete-beat",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power3.out" },
        0.4,
      );
      tl.fromTo(
        "#b1 .linea > span",
        { yPercent: 116 },
        { yPercent: 0, duration: 0.74, stagger: 0.13, ease: "expo.out" },
        0.44,
      );

      /* Beat 2 · la invitación: asentada a los 4.11 s, quieta hasta 5.36 s */
      tl.fromTo(
        "#b2 .eyebrow",
        { opacity: 0, x: -22 },
        { opacity: 1, x: 0, duration: 0.48, ease: "power2.out" },
        3.15,
      );
      tl.fromTo(
        "#b2 .filete-beat",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power3.out" },
        3.25,
      );
      tl.fromTo(
        "#b2 .linea > span",
        // Asciende, como el beat 1, pero escalonado de abajo hacia arriba y
        // con deriva lateral: entrar descendiendo hacía que la primera línea
        // cruzara por encima del filete y del eyebrow.
        { yPercent: 118, x: 46 },
        {
          yPercent: 0,
          x: 0,
          duration: 0.68,
          stagger: { each: 0.13, from: "end" },
          ease: "power4.out",
        },
        3.3,
      );

      /* Salidas dentro del revelado en banda, nunca en corte seco. */
      tl.to("#b1 .beat-inner", { opacity: 0, duration: 0.22, ease: "power2.in" }, 2.52);
      tl.to("#b2 .beat-inner", { opacity: 0, duration: 0.22, ease: "power2.in" }, 5.36);

      /* ------------------------------------------------------------------
         CIERRE — la invitación a caminar hasta el local.
         El logo deja la esquina y aterriza en el centro, mas grande, como
         cabecera del lockup final; el filete y el enlace de la esquina se
         apagan y el dominio queda solo en el CTA central.
         ------------------------------------------------------------------ */
      /* Centro del logo en reposo: (96+230, 64+42) = (326, 106).
         Destino: (960, 250) → dx 634, dy 144; escala 1.5 (690x126). */
      tl.to(
        "#marca .logo",
        { x: 634, y: 144, scale: 1.5, duration: 0.95, ease: "power3.inOut" },
        5.75,
      );
      tl.to("#marca .filete", { opacity: 0, duration: 0.3, ease: "power2.in" }, 5.75);
      tl.to("#marca .enlace", { opacity: 0, duration: 0.3, ease: "power2.in" }, 5.75);
      tl.fromTo(
        "#cierre-fondo",
        { opacity: 0 },
        { opacity: 1, duration: 0.42, ease: "power2.out" },
        5.75,
      );
      tl.fromTo(
        "#cierre .invitacion",
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        5.85,
      );
      tl.fromTo(
        "#cierre .filete-cierre",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" },
        6.1,
      );
      tl.fromTo(
        "#cierre .lugar",
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        6.22,
      );
      tl.fromTo(
        "#cierre .ciudad",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        6.36,
      );
      tl.fromTo(
        "#cierre .web",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        6.48,
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
