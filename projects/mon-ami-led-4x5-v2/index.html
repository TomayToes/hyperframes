<!doctype html>
<html lang="es-HN" data-composition-width="1080" data-composition-height="1350">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Mon Ami — LED 4:5 (lectura pausada)</title>
    <!-- GSAP vendorizado (3.14.2): el render no hace ninguna petición de red. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Fuentes de marca servidas desde el proyecto (subset latin, variables):
         render offline y determinista, sin fetch en tiempo de render. */
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: normal;
        font-weight: 300 700;
        font-display: block;
        src: url("assets/fonts/cormorant-garamond-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Jost";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("assets/fonts/jost-latin.woff2") format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #000;
      }

      /* ---- Tokens de marca Mon Ami (assets/tokens.json) ---- */
      :root {
        --ma-negro: #000000;
        --ma-dorado: #e9d9a0;
        --ma-dorado-luz: #f4e9c2;
        --ma-dorado-bronce: #b8862e;
        --ma-crema: #f4efe4;
        --ma-taupe: #a49d8f;
        --ma-borgona: #6e1423;
        --safe: 84px;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--ma-negro);
      }

      /* ============================================================
         CAPA COMPARTIDA (no es clip — vive toda la composición).
         Tres tomas nada más: el ritmo lo lleva el movimiento de cámara
         dentro de cada toma, no el corte.
         ============================================================ */
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .shot {
        position: absolute;
        inset: 0;
        opacity: 0;
        will-change: opacity;
      }
      /* Ventana de revelado: se abre en banda horizontal (scaleY). */
      .banda {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transform-origin: 50% 50%;
      }
      /* Contra-escala: cancela el aplastado de la banda para que la foto
         nunca se deforme mientras la ventana se abre. */
      .contra {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      .shot img {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1080px;
        height: 1350px;
        object-fit: cover;
        transform: translate(-50%, -50%);
        transform-origin: 50% 42%;
        will-change: transform;
      }

      /* Barrido de luz cálida: cruza el frame en el arranque de cada toma. */
      #barrido {
        position: absolute;
        top: -24%;
        left: 0;
        width: 62%;
        height: 148%;
        /* Horizontal puro: sobre una caja mas alta que ancha, un angulo
           cercano a la vertical deja los bordes laterales sin difuminar. */
        background: linear-gradient(
          to right,
          rgba(233, 217, 160, 0) 0%,
          rgba(244, 233, 194, 0.08) 28%,
          rgba(233, 217, 160, 0.2) 50%,
          rgba(244, 233, 194, 0.08) 72%,
          rgba(233, 217, 160, 0) 100%
        );
        mix-blend-mode: screen;
        opacity: 0;
      }

      /* Bloom ámbar: simula el spot cálido del local. */
      #bloom {
        position: absolute;
        left: 50%;
        top: 34%;
        width: 1500px;
        height: 1500px;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle,
          rgba(233, 217, 160, 0.22) 0%,
          rgba(184, 134, 46, 0.1) 34%,
          rgba(0, 0, 0, 0) 66%
        );
        mix-blend-mode: screen;
        opacity: 0.5;
      }

      /* Viñeta de ambiente (visual-specs §3). */
      #vineta {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 38%,
          rgba(0, 0, 0, 0) 30%,
          rgba(0, 0, 0, 0.52) 100%
        );
      }

      /* Scrim inferior — obligatorio bajo todo texto sobre foto (§4.2). */
      #scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.95) 0%,
          rgba(0, 0, 0, 0.9) 22%,
          rgba(0, 0, 0, 0.66) 38%,
          rgba(0, 0, 0, 0.22) 54%,
          rgba(0, 0, 0, 0) 72%
        );
      }
      /* Scrim superior, corto: protege el riel de marca. */
      #scrim-top {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.86) 0%,
          rgba(0, 0, 0, 0.62) 8%,
          rgba(0, 0, 0, 0.2) 14%,
          rgba(0, 0, 0, 0) 22%
        );
      }

      #grano {
        position: absolute;
        inset: -64px;
        background-image: url("assets/img/grain.png");
        background-size: 256px 256px;
        opacity: 0.13;
        mix-blend-mode: overlay;
      }

      /* ---- Herrajes de marca: riel superior + marcas de registro ---- */
      #riel {
        position: absolute;
        top: 96px;
        left: var(--safe);
        right: var(--safe);
        display: flex;
        align-items: center;
        gap: 22px;
      }
      #riel .filete {
        height: 2px;
        width: 76px;
        background: linear-gradient(90deg, rgba(184, 134, 46, 0) 0%, var(--ma-dorado) 100%);
        transform-origin: right center;
      }
      #riel .rotulo {
        font-family: "Jost", sans-serif;
        font-weight: 400;
        font-size: 30px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--ma-taupe);
        white-space: nowrap;
      }
      #riel .filete-largo {
        height: 1px;
        flex: 1;
        background: linear-gradient(90deg, rgba(184, 134, 46, 0.55) 0%, rgba(184, 134, 46, 0) 100%);
        transform-origin: left center;
      }

      .marca-registro {
        position: absolute;
        width: 34px;
        height: 34px;
        border-color: var(--ma-dorado-bronce);
        border-style: solid;
        opacity: 0.65;
      }
      .mr-tl {
        top: 44px;
        left: 44px;
        border-width: 2px 0 0 2px;
      }
      .mr-tr {
        top: 44px;
        right: 44px;
        border-width: 2px 2px 0 0;
      }
      .mr-bl {
        bottom: 44px;
        left: 44px;
        border-width: 0 0 2px 2px;
      }
      .mr-br {
        bottom: 44px;
        right: 44px;
        border-width: 0 2px 2px 0;
      }

      /* ============================================================
         CAPAS DE TEXTO — clips transparentes, uno por beat.
         ============================================================ */
      .beat {
        position: absolute;
        left: var(--safe);
        right: var(--safe);
        bottom: 168px;
        z-index: 20;
      }
      /* La opacidad se anima en este hijo, nunca en el .clip:
         el framework ya controla la visibilidad del clip. */
      .beat-inner {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 26px;
      }

      .eyebrow {
        font-family: "Jost", sans-serif;
        font-weight: 400;
        font-size: 34px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--ma-taupe);
      }

      .filete-beat {
        height: 2px;
        width: 132px;
        background: linear-gradient(
          100deg,
          var(--ma-dorado-bronce) 0%,
          var(--ma-dorado-luz) 48%,
          var(--ma-dorado-bronce) 100%
        );
        transform-origin: left center;
      }

      /* Reveal por máscara: cada línea vive en su propia ventana. */
      .linea {
        display: block;
        overflow: hidden;
        transform-origin: left center;
        padding-bottom: 0.12em;
      }
      .linea > span {
        display: block;
        font-family: "Cormorant Garamond", serif;
        line-height: 1.06;
      }

      .titular > span {
        font-weight: 300;
        font-size: 112px;
        color: var(--ma-crema);
      }
      .plato > span {
        font-weight: 400;
        font-size: 96px;
        color: var(--ma-dorado);
      }

      /* ---- Beat 3: cierre — la invitación a venir al local ---- */
      #cierre {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 var(--safe);
        z-index: 30;
      }
      /* Más claro que un cierre a negro: se quiere que la mesa puesta
         siga leyéndose detrás — es a eso a lo que se invita. */
      #cierre-fondo {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 50% 76%,
            rgba(110, 20, 35, 0.34) 0%,
            rgba(110, 20, 35, 0.14) 52%,
            rgba(110, 20, 35, 0) 96%
          ),
          rgba(0, 0, 0, 0.8);
      }
      #cierre .lockup {
        position: relative;
        width: 648px;
        height: auto;
        display: block;
      }
      #cierre .invitacion {
        position: relative;
        margin-top: 58px;
        font-family: "Cormorant Garamond", serif;
        font-weight: 400;
        font-size: 84px;
        line-height: 1.08;
        color: var(--ma-dorado);
        text-align: center;
      }
      #cierre .filete-cierre {
        position: relative;
        margin-top: 44px;
        height: 2px;
        width: 200px;
        background: linear-gradient(
          100deg,
          rgba(184, 134, 46, 0) 0%,
          var(--ma-dorado-luz) 50%,
          rgba(184, 134, 46, 0) 100%
        );
        transform-origin: center;
      }
      /* La dirección manda: el objetivo del spot es que la gente camine
         hasta el local, así que pesa más que el teléfono. */
      #cierre .lugar {
        position: relative;
        margin-top: 42px;
        font-family: "Jost", sans-serif;
        font-weight: 400;
        font-size: 46px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ma-crema);
        text-align: center;
      }
      #cierre .ciudad {
        position: relative;
        margin-top: 16px;
        font-family: "Jost", sans-serif;
        font-weight: 300;
        font-size: 30px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--ma-taupe);
      }
      #cierre .tel {
        position: relative;
        margin-top: 34px;
        font-family: "Jost", sans-serif;
        font-weight: 500;
        font-size: 38px;
        letter-spacing: 0.14em;
        font-variant-numeric: tabular-nums;
        color: var(--ma-dorado-luz);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1350"
    >
      <!-- ===== Capa compartida: tres tomas + atmósfera ===== -->
      <div id="stage" data-layout-allow-overflow>
        <div class="shot" id="sh-burger">
          <div class="banda">
            <div class="contra"><img src="assets/img/burger.jpg" alt="" /></div>
          </div>
        </div>
        <div class="shot" id="sh-ribs">
          <div class="banda">
            <div class="contra"><img src="assets/img/ribs.jpg" alt="" /></div>
          </div>
        </div>
        <div class="shot" id="sh-mesa">
          <div class="banda">
            <div class="contra"><img src="assets/img/mesa.jpg" alt="" /></div>
          </div>
        </div>

        <div id="barrido"></div>
        <div id="bloom"></div>
        <div id="vineta"></div>
        <div id="scrim"></div>
        <div id="scrim-top"></div>
        <div id="grano"></div>
      </div>

      <!-- ===== Herrajes de marca (0.00 – 6.74) ===== -->
      <section id="herrajes" class="clip" data-start="0" data-duration="6.74" data-track-index="7">
        <div id="riel">
          <div class="filete"></div>
          <div class="rotulo">San Pedro Sula</div>
          <div class="filete-largo"></div>
        </div>

        <div class="marca-registro mr-tl"></div>
        <div class="marca-registro mr-tr"></div>
        <div class="marca-registro mr-bl"></div>
        <div class="marca-registro mr-br"></div>
      </section>

      <!-- ===== Beat 1 · gancho (0.00 – 3.34) ===== -->
      <section id="b1" class="clip beat" data-start="0" data-duration="3.34" data-track-index="1">
        <div class="beat-inner">
          <div class="eyebrow">Mon Ami · Bistro Bar</div>
          <div class="filete-beat"></div>
          <div class="linea titular" data-layout-allow-overflow><span>Se está sirviendo</span></div>
          <div class="linea titular" data-layout-allow-overflow><span>ahora.</span></div>
        </div>
      </section>

      <!-- ===== Beat 2 · el plato (3.40 – 6.74) ===== -->
      <section id="b2" class="clip beat" data-start="3.4" data-duration="3.34" data-track-index="2">
        <div class="beat-inner">
          <div class="eyebrow">A fuego lento</div>
          <div class="filete-beat"></div>
          <div class="linea plato" data-layout-allow-overflow><span>Costillas BBQ</span></div>
        </div>
      </section>

      <!-- ===== Beat 3 · cierre: vení al restaurante (6.80 – 10.00) ===== -->
      <section id="cierre" class="clip" data-start="6.8" data-duration="3.2" data-track-index="3">
        <div id="cierre-fondo"></div>
        <img class="lockup" src="assets/logo-mon-ami-gold.png" alt="Mon Ami Bistro Bar" />
        <div class="invitacion">Vení esta noche.</div>
        <div class="filete-cierre"></div>
        <div class="lugar">Plaza Paseo Próceres</div>
        <div class="ciudad">San Pedro Sula</div>
        <div class="tel">9466 2727</div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ------------------------------------------------------------------
         CAPA FOTOGRÁFICA — tres tomas, dos cortes en todo el spot.
         El ritmo ya no lo lleva el corte sino la cámara dentro de cada
         toma: recorridos largos, de 3.4 s, en sentidos opuestos.

           beat  toma      in     out    cámara
           1     burger    0.00   3.40   empuje largo + subida
           2     ribs      3.40   6.80   retroceso + barrido lateral
           3     mesa      6.80  10.00   empuje lento (fondo del cierre)

         La toma 2 y la 3 entran por REVELADO EN BANDA: la ventana .banda
         se abre en scaleY mientras .contra la compensa, de modo que la
         foto nunca se deforma. Sustituye a la disolvencia y da movimiento
         propio a un corte que ahora es la mitad de frecuente.
         ------------------------------------------------------------------ */
      tl.set("#sh-burger", { opacity: 1 }, 0);
      tl.fromTo(
        "#sh-burger img",
        { scale: 1.0, x: 0, y: 0 },
        { scale: 1.2, x: 0, y: -26, duration: 3.4, ease: "none" },
        0,
      );

      tl.set("#sh-ribs", { opacity: 1 }, 3.06);
      tl.fromTo(
        "#sh-ribs .banda",
        { scaleY: 0.44 },
        { scaleY: 1, duration: 0.52, ease: "power3.out" },
        3.06,
      );
      tl.fromTo(
        "#sh-ribs .contra",
        { scaleY: 2.273 },
        { scaleY: 1, duration: 0.52, ease: "power3.out" },
        3.06,
      );
      // La toma saliente disuelve mientras la banda abre: sin esto se ven
      // las dos fotos a la vez y el corte lee como error, no como diseño.
      tl.to("#sh-burger", { opacity: 0, duration: 0.42, ease: "power2.inOut" }, 3.06);
      tl.fromTo(
        "#sh-ribs img",
        { scale: 1.18, x: -34, y: -10 },
        { scale: 1.02, x: 30, y: 8, duration: 3.74, ease: "none" },
        3.06,
      );

      tl.set("#sh-mesa", { opacity: 1 }, 6.5);
      tl.fromTo(
        "#sh-mesa .banda",
        { scaleY: 0.44 },
        { scaleY: 1, duration: 0.52, ease: "power3.out" },
        6.5,
      );
      tl.fromTo(
        "#sh-mesa .contra",
        { scaleY: 2.273 },
        { scaleY: 1, duration: 0.52, ease: "power3.out" },
        6.5,
      );
      tl.to("#sh-ribs", { opacity: 0, duration: 0.42, ease: "power2.inOut" }, 6.5);
      tl.fromTo(
        "#sh-mesa img",
        { scale: 1.02, x: 0, y: 16 },
        { scale: 1.16, x: 0, y: -14, duration: 3.5, ease: "none" },
        6.5,
      );

      /* ---- Barrido de luz: cruza el frame al abrir cada toma ----
         Recorrido y envolvente de opacidad van en tweens separados, y las
         dos rampas de opacidad no se solapan: dos tweens escribiendo la
         misma propiedad a la vez dependen del orden de overwrite de GSAP
         y pueden variar entre renders. */
      tl.fromTo(
        "#barrido",
        { x: -820, skewX: -9 },
        { x: 1240, skewX: -9, duration: 1.1, ease: "power2.inOut" },
        0.1,
      );
      tl.fromTo(
        "#barrido",
        { opacity: 0 },
        { opacity: 0.78, duration: 0.34, ease: "power2.out" },
        0.1,
      );
      tl.to("#barrido", { opacity: 0, duration: 0.3, ease: "power2.in" }, 0.9);

      tl.fromTo(
        "#barrido",
        { x: -820, skewX: -9 },
        { x: 1240, skewX: -9, duration: 1.1, ease: "power2.inOut" },
        3.2,
      );
      tl.fromTo(
        "#barrido",
        { opacity: 0 },
        { opacity: 0.78, duration: 0.34, ease: "power2.out" },
        3.2,
      );
      tl.to("#barrido", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.0);

      tl.fromTo(
        "#barrido",
        { x: -820, skewX: -9 },
        { x: 1240, skewX: -9, duration: 1.2, ease: "power2.inOut" },
        6.6,
      );
      tl.fromTo(
        "#barrido",
        { opacity: 0 },
        { opacity: 0.6, duration: 0.34, ease: "power2.out" },
        6.6,
      );
      tl.to("#barrido", { opacity: 0, duration: 0.34, ease: "power2.in" }, 7.4);

      /* ---- Atmósfera ---- */
      tl.fromTo(
        "#bloom",
        { opacity: 0.76, scale: 1.06 },
        { opacity: 0.44, scale: 1, duration: 1.2, ease: "power2.out" },
        0,
      );
      tl.fromTo(
        "#bloom",
        { opacity: 0.76, scale: 1.06 },
        { opacity: 0.44, scale: 1, duration: 1.2, ease: "power2.out" },
        3.06,
      );
      tl.fromTo(
        "#bloom",
        { opacity: 0.76, scale: 1.06 },
        { opacity: 0.44, scale: 1, duration: 1.2, ease: "power2.out" },
        6.5,
      );
      tl.fromTo(
        "#vineta",
        { opacity: 0.82 },
        { opacity: 1, duration: 5, ease: "sine.inOut", yoyo: true, repeat: 1 },
        0,
      );
      // Deriva del grano: 4 tramos discretos, sin aleatoriedad en tiempo de render.
      tl.to("#grano", { x: 26, y: -18, duration: 2.5, ease: "none" }, 0);
      tl.to("#grano", { x: -14, y: 22, duration: 2.5, ease: "none" }, 2.5);
      tl.to("#grano", { x: 20, y: 12, duration: 2.5, ease: "none" }, 5);
      tl.to("#grano", { x: -22, y: -10, duration: 2.5, ease: "none" }, 7.5);

      /* ---- Herrajes permanentes ---- */
      tl.fromTo(
        "#riel .filete",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" },
        0.15,
      );
      tl.fromTo(
        "#riel .rotulo",
        { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" },
        0.3,
      );
      tl.fromTo(
        "#riel .filete-largo",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.8, ease: "power3.out" },
        0.4,
      );
      tl.fromTo(
        ".marca-registro",
        { opacity: 0, scale: 0.6 },
        { opacity: 0.65, scale: 1, duration: 0.5, stagger: 0.06, ease: "back.out(2)" },
        0.2,
      );

      /* ------------------------------------------------------------------
         TIPOGRAFÍA — el cambio de fondo respecto de la v1.
         Cada línea entra en ~0.7 s y luego se queda QUIETA más de 2 s.
         Ese reposo es el tiempo de lectura; antes era de ~1 s.
         ------------------------------------------------------------------ */

      /* Beat 1 · gancho — asentado a los 1.14 s, quieto hasta 3.14 s (2.0 s de lectura) */
      tl.fromTo(
        "#b1 .eyebrow",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.3,
      );
      tl.fromTo(
        "#b1 .filete-beat",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "power3.out" },
        0.4,
      );
      tl.fromTo(
        "#b1 .linea > span",
        { yPercent: 116 },
        { yPercent: 0, duration: 0.78, stagger: 0.14, ease: "expo.out" },
        0.44,
      );

      /* Beat 2 · el plato — asentado a los 4.42 s, quieto hasta 6.54 s (2.1 s de lectura) */
      tl.fromTo(
        "#b2 .eyebrow",
        { opacity: 0, x: -22 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" },
        3.62,
      );
      tl.fromTo(
        "#b2 .filete-beat",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "power3.out" },
        3.72,
      );
      tl.fromTo(
        "#b2 .linea > span",
        { yPercent: -118, rotation: -2 },
        { yPercent: 0, rotation: 0, duration: 0.72, ease: "expo.out" },
        3.76,
      );

      /* Salidas dentro del revelado en banda, nunca en corte seco. */
      tl.to("#b1 .beat-inner", { opacity: 0, duration: 0.22, ease: "power2.in" }, 2.9);
